case:
  id: A1
  name: Strict reference-to-theme DTC PDP gate
  kind: negative_gate
  purpose: Verify that explicit exact replication blocks truthfully when the selected theme cannot reproduce required topology.

input:
  brand: Velopro
  product_category: city electric bicycle
  target_market: United Kingdom DTC
  platform: shopify
  build_route: template
  strategy_intent: Follow the specified page's visible content, order, and paired Desktop/Mobile states of one responsive topology.
  reference_mode: reference_to_theme
  fidelity_profile: strict_replication
  structure_source_urls:
    - https://uk.fiido.com/products/fiido-c700-city-ebike
  theme:
    name: Concept
    preset: Inova
    capability_urls:
      - https://themes.shopify.com/themes/concept/presets/inova
      - https://roartheme.co/blogs/concept
  content_mode: placeholder
  page: PDP
  figma:
    file_url: https://www.figma.com/design/9wxWMFjt5Qdz4Dnn5iGMKQ/Velopro-%E2%80%94-Shopify-PDP-%E2%80%94-Concept
    comparison_node_id: 128:3

assertions:
  - Source identity remains the Fiido C700 page and never becomes the Concept demo.
  - Source section count and composition groups are discovered from the current rendered source; no fixed count is supplied by this fixture.
  - Product media, information, options, purchase controls, and attached add-ons remain grouped when the source renders them as one connected experience.
  - Every target mapping uses exact Concept Section, Block, and Setting names with evidence.
  - composed_native is accepted only when the combined native output preserves one source boundary and topology.
  - Desktop and Mobile topology, visible-item counts, interaction, overflow, and responsive transformation are validated as paired states of the same Section identities and shared content bindings.
  - Placeholder media preserves captured geometry and does not impose a generic black-box or card-grid layout.
  - Parent-child containment and named overflow contracts pass.
  - No layer or report uses Approved without approval provenance.
  - A result that only covers source topics is blocked.
  - Every visible source module receives one unique Rxx row before composition groups or mapping are created.
  - Any exact topology or interaction mismatch that lacks explicit approval blocks before Figma.
  - Source capture and theme mapping statuses are reported separately; Figma build and Figma QA are not_run when the strict gate blocks.
  - The expected overall result is blocked with named evidence gaps, not a low-fidelity generated page.

anti_overfit:
  - Do not encode the Fiido name, bicycle vocabulary, detected section count, lime color, or long-page rhythm in any Skill.
  - Do not treat this PDP as proof of catalog-wide coverage.
