case:
  id: C
  name: Strict reference with theme-customization feasibility gate
  kind: negative_gate
  purpose: Verify that an interaction-heavy reference is not flattened into generic theme modules to force a pass.

input:
  brand: Sona
  brand_status: fictional regression fixture
  product_category: premium wireless in-ear headphones
  target_market: United States DTC
  platform: shopify
  build_route: theme_customization
  strategy_intent: Follow the specified source structure and topology only where the route can truthfully implement it.
  structure_source_urls:
    - https://www.apple.com/airpods-pro/
  theme:
    name: Concept
    preset: Inova
    capability_urls:
      - https://themes.shopify.com/themes/concept/presets/inova
      - https://roartheme.co/blogs/concept
  content_mode: placeholder
  page: PDP
  custom_budget:
    maximum_section_count_ratio: 0.20
    maximum_estimated_height_ratio: 0.20

assertions:
  - Source identity remains the specified Apple product page; Apple assets and claims remain reference-only.
  - Dynamic, sticky, scroll-linked, carousel, media, and responsive behaviors are captured as topology and interaction contracts.
  - Generic Concept sections are not accepted merely because they cover the same feature topic.
  - Every native or composed-native claim has exact field-level evidence.
  - Every unsupported interaction or topology is classified at the correct implementation level and included in both custom-budget calculations.
  - The workflow blocks before Figma when mappings remain unresolved or the custom budget is exceeded without approval.
  - A truthful blocked result with named gaps is a passing evaluation outcome.
  - No output uses Approved without provenance.

anti_overfit:
  - Do not add Apple-specific layouts, AirPods copy, or interaction patterns to general Skills.
  - Do not weaken route gates merely to finish the page.
