case_id: round3_e_open_brand_custom
route: custom
user_prompt: |
  使用 $iwish-ui-workflow 完成一个纯自定义 DTC Homepage，从研究、品牌方向、临时视觉素材到原生可编辑 Figma 直接执行，只有真实硬阻塞才提问。

  项目资料：
  - 产品：可以组合成床边台阶、窗边平台、墙面路径和休息窝的模块化室内猫家具系统
  - 目标市场：德国 DTC
  - 平台：Shopify，但页面完全自定义，不受主题 Section 约束
  - 项目场景：纯自定义
  - 页面：Homepage
  - 网站语言：英文
  - 品牌：尚未建立；请根据产品、室内空间、猫的使用行为、德国市场与竞争研究创建本项目的英文品牌名、Wordmark 方向、配色、字体和视觉系统
  - 现有素材：无 Logo、无品牌色、无最终产品摄影、无已批准材质规格、承重、认证、评价、价格或商业承诺
  - 指定结构网站：无
  - 视觉参考：无
  - 竞品：由 AI 调研
  - 内容模式：客户可评审的英文占位内容
  - Figma：新建独立设计文件，固定使用 liu tailin's team（Full，team::1641483933611069221）

  页面必须让客户看懂模块怎样形成不同家具配置、产品如何进入真实室内环境，以及品牌为什么与普通宠物用品不同。临时产品、配置和生活方式视觉需要达到客户可评审程度且可替换，不得虚构产品性能或商业事实。生成同一响应式系统的 Desktop/Mobile 可编辑预览与组件结构，内部说明和 QA 不得进入客户预览。
