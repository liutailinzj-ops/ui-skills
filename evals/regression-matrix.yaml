stability_claims:
  case_passed: Only the named case and tested capability passed.
  core_routes_passed: Every ready core case passed.
  suite_passed: Every ready case passed or produced its expected truthful blocked result.
  production_stable: Not permitted from this suite alone; requires repeated real-project evidence.
